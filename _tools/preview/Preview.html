<!doctype html>
<meta charset="utf-8">
<title>Crystal Ball — showcase</title>
<!--
  Engraves the mod name and its summary line onto the showcase, to the repository
  standard in STYLE_RIMWORLD.md: 896x504, title over the calm upper-left third,
  58x3 amber rule, 21 px summary on 430 px.

  Rendered by Chrome headless at the final size, so the glyphs are never
  resampled. The background is Art/Preview-source.png, the full-resolution
  render, never the reduced Preview.png.

    chrome --headless --no-sandbox --disable-gpu --hide-scrollbars \
      --window-size=896,504 --force-device-scale-factor=1 \
      --screenshot=../../Mod/About/Preview.png Preview.html

  Geometry measured off the first engraving so a re-render lands on the same
  pixels: rule at (50,141), cap-top of the title at y=70, summary from y=165
  with a 29 px leading.
-->
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 896px; height: 504px; position: relative; overflow: hidden; }

  .scene {
    position: absolute; inset: 0;
    background: url('../../Art/Preview-source.png') center / cover no-repeat;
  }

  /* Darkens the upper-left third so the text reads, and leaves the ball alone. */
  .veil {
    position: absolute; inset: 0;
    background: radial-gradient(circle at top left,
                rgba(6, 5, 4, .86) 0%, rgba(6, 5, 4, 0) 74%);
  }

  .plate {
    position: absolute; left: 50px; top: 60px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  .name {
    margin: 0; font-size: 62px; font-weight: 700; line-height: 1;
    color: #FBF7EF; letter-spacing: -1.1px;
    text-shadow: 0 2px 18px rgba(0, 0, 0, .55);
  }

  .rule {
    width: 58px; height: 3px; margin: 19px 0 0; background: #D68F2C;
  }

  .line {
    margin: 14px 0 0; width: 430px;
    font-size: 21px; line-height: 29px; font-weight: 400;
    color: rgba(251, 247, 239, .88);
    text-shadow: 0 1px 12px rgba(0, 0, 0, .6);
  }
</style>

<div class="scene"></div>
<div class="veil"></div>
<div class="plate">
  <p class="name">Crystal Ball</p>
  <div class="rule"></div>
  <p class="line">A violet sphere to gaze into, with a recreation type of its own.</p>
</div>
